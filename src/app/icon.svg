<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Gold Gradients -->
    <linearGradient id="goldGradientMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="35%" stop-color="#D9921B" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    
    <linearGradient id="goldGradientAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D9921B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424" />
      <stop offset="100%" stop-color="#05070E" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D9921B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Obsidian Container with Gold Rim -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#goldGradientMain)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Ascend Growth Iconic Chevron Wings Ribbon -->
  <g filter="url(#goldGlow)">
    <!-- Top Ascending Wing Ribbon -->
    <path 
      d="M14 36.5 C22 35, 34 26, 50 17 C42 22, 33 26.5, 23 30.5 C18 32.5, 14 36.5, 14 36.5 Z" 
      fill="url(#goldGradientMain)" 
    />
    
    <!-- Central Forward Dynamic Sweep -->
    <path 
      d="M16 43 C26 40, 38 29, 52 23 C40 28, 30 34, 22 39 C18 41, 16 43, 16 43 Z" 
      fill="url(#goldGradientAccent)" 
    />
    
    <!-- Lower Horizon Ascent Baseline -->
    <path 
      d="M20 48 C28 45, 36 38, 46 32 C38 36, 30 40, 24 45 C21 47, 20 48, 20 48 Z" 
      fill="url(#goldGradientMain)" 
      opacity="0.85"
    />
  </g>
</svg>
